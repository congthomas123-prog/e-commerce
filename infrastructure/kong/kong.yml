_format_version: "3.0"
_transform: true
services:
  - name: auth-service
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    protocol: http
    host: host.docker.internal
    port: 3001
    routes:
      - name: auth-route
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        paths:
          - /api/auth
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 120
              policy: local
  - name: order-service
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    protocol: http
    host: host.docker.internal
    port: 3004
    routes:
      - name: order-route
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        paths:
          - /api/v1/orders
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
  - name: payment-service
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    protocol: http
    host: host.docker.internal
    port: 3005
    routes:
      - name: payment-route
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        paths:
          - /api/v1/payments
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: rate-limiting
            config:
              minute: 60
              policy: local
  - name: product-service
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    protocol: http
    host: host.docker.internal
    port: 3003
    routes:
      - name: product-route
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        paths:
          - /api/v1/products
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
  - name: user-service
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    protocol: http
    host: host.docker.internal
    port: 3002
    routes:
      - name: user-route
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        paths:
          - /api/v1/users
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Origin
        - X-Request-Id
      exposed_headers:
        - X-Request-Id
      credentials: true
      max_age: 3600
  - name: file-log
    config:
      path: /dev/stdout
      reopen: false
