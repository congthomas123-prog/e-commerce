- name: cors
  config:
    origins:
      - http://localhost:3000
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    headers:
      - Accept
      - Authorization
      - Content-Type
      - Origin
      - X-Request-Id
    exposed_headers:
      - X-Request-Id
    credentials: true
    max_age: 3600
